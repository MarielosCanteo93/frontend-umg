<div class="stat-card">

  <div class="stat-top">

    <div class="stat-icon">
      {{ icon }}
    </div>

    <span class="stat-label">
      {{ title }}
    </span>

  </div>

  <div class="stat-bottom">

    <strong class="stat-value">
      {{ value }}
    </strong>

    <span class="stat-indicator">
      Actualizado
    </span>

  </div>

</div>
