<div class="login-page">

  <div class="login-card">

    <!-- FORMULARIO -->
    <div class="login-form-side">

      <h1>¡Bienvenido!</h1>

      <p class="subtitle">
        Ingreso a la API UMG. - Marielos Canteo
      </p>

      <form (ngSubmit)="login()">

        <!-- USUARIO -->
        <div class="input-group">

          <label for="username">
            Usuario
          </label>

          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="username"
            placeholder="Tu usuario"
            autocomplete="username"
            required
          />

        </div>


        <!-- CONTRASEÑA -->
        <div class="input-group">

          <label for="password">
            Contraseña
          </label>

          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Tu contraseña"
            autocomplete="current-password"
            required
          />

        </div>


        <!-- MENSAJE DE ERROR -->
        @if (errorMessage) {

          <div class="error-message">
            {{ errorMessage }}
          </div>

        }


        <!-- BOTÓN -->
        <button
          type="submit"
          class="submit-btn"
          [disabled]="loading">

          {{ loading ? 'Ingresando...' : 'Iniciar Sesión' }}

        </button>

      </form>

    </div>


    <!-- IMAGEN / LADO DERECHO -->
    <div class="login-image-side">

      <div class="image-placeholder-text">
        Sistema de Reservas de Laboratorios
      </div>

    </div>

  </div>

</div>
